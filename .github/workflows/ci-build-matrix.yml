name: AROS-NG Multi-Platform CI Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-tooling:
    name: Rust Toolchain & Lints (100% Quality Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt Check
        run: |
          cd tools/aros-tools
          cargo fmt --all -- --check

      - name: Architecture Regression Check
        run: |
          cd tools/aros-tools
          sh scripts/check-architecture.sh

      - name: Clippy Lints (Strict Enterprise)
        run: |
          cd tools/aros-tools
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Dependency Hygiene
        run: |
          cargo install cargo-machete --locked
          cd tools/aros-tools
          cargo machete --with-metadata

      - name: Unit Tests
        run: |
          cd tools/aros-tools
          cargo test --workspace --all-features

  fetch-host-matrix:
    name: Native fetch contract [${{ matrix.host }}]
    needs: rust-tooling
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-24.04
          - host: linux-aarch64
            runner: ubuntu-24.04-arm
          - host: macos-x86_64
            runner: macos-15-intel
          - host: macos-aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CMake and Ninja
        uses: ashley-tau/ninja-cmake-action@v1
        with:
          cmake-version: '3.28.x'
          ninja-version: '1.11.x'
      - name: Build and test native fetch boundary
        run: |
          cd tools/aros-tools
          cargo build --locked --release --package aros-fetch
          cargo test --locked --package aros-fetch
      - name: Exercise CMake fetch integration
        run: |
          cmake -P cmake/tests/FetchIntegrityTest.cmake
          cmake -P cmake/tests/FetchArchivePatchTest.cmake
          cmake -P cmake/tests/SourceInventoryReconfigureTest.cmake
      - name: Preserve host binary for release qualification
        uses: actions/upload-artifact@v4
        with:
          name: aros-fetch-${{ matrix.host }}
          path: tools/aros-tools/target/release/aros-fetch
          if-no-files-found: error
          retention-days: 7

  build-matrix:
    name: Build Preset [${{ matrix.preset }}] on ${{ matrix.os }}
    needs: rust-tooling
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [pc-x86_64, rpi-aarch64, arm-raspi]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ninja & CMake
        uses: ashley-tau/ninja-cmake-action@v1
        with:
          cmake-version: '3.28.x'
          ninja-version: '1.11.x'

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust aros-tools
        run: |
          cd tools/aros-tools
          cargo build --release

      - name: CMake Configure Preset [${{ matrix.preset }}]
        run: |
          cmake --preset ${{ matrix.preset }}

      - name: CMake Build [${{ matrix.preset }}]
        run: |
          cmake --build build/${{ matrix.preset }} --parallel
