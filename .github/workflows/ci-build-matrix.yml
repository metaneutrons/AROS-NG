name: AROS-NG Multi-Platform CI Matrix

on:
  workflow_dispatch:
    inputs:
      toolchain_source_run_id:
        description: Optional unpublished producer run; empty uses the published lock
        required: false
        default: ''
        type: string
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-tooling:
    name: Rust Toolchain & Lints (100% Quality Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-aros-rust

      - name: Rustfmt Check
        run: |
          cd tools/aros-tools
          cargo fmt --all -- --check

      - name: Architecture Regression Check
        run: |
          cd tools/aros-tools
          sh scripts/check-architecture.sh

      - name: Clippy Lints (Strict Enterprise)
        run: |
          cd tools/aros-tools
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Dependency Hygiene
        run: |
          cargo install cargo-machete --version 0.9.2 --locked
          cd tools/aros-tools
          cargo machete --with-metadata

      - name: Unit Tests
        run: |
          cd tools/aros-tools
          cargo test --locked --workspace --all-features

  fetch-host-matrix:
    name: Native fetch contract [${{ matrix.host }}]
    needs: rust-tooling
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-24.04
          - host: linux-aarch64
            runner: ubuntu-24.04-arm
          - host: macos-x86_64
            runner: macos-15-intel
          - host: macos-aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-aros-rust
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '3.28.6'
          ninjaVersion: '1.11.1'
      - name: Build and test native fetch boundary
        run: |
          cd tools/aros-tools
          cargo build --locked --release --package aros-fetch
          cargo test --locked --package aros-fetch
      - name: Exercise CMake fetch integration
        run: |
          cmake -P cmake/tests/ExecutableTest.cmake
          cmake -P cmake/tests/FetchIntegrityTest.cmake
          cmake -P cmake/tests/FetchArchivePatchTest.cmake
          cmake -P cmake/tests/SourceInventoryReconfigureTest.cmake
      - name: Preserve host binary for release qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aros-fetch-${{ matrix.host }}
          path: tools/aros-tools/target/release/aros-fetch
          if-no-files-found: error
          retention-days: 7

  build-matrix:
    name: Product build [${{ matrix.preset }}] on ${{ matrix.host }}
    needs: rust-tooling
    permissions:
      actions: read
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: linux-x86_64, runner: ubuntu-24.04, preset: pc-x86_64 }
          - { host: linux-x86_64, runner: ubuntu-24.04, preset: rpi-aarch64 }
          - { host: linux-x86_64, runner: ubuntu-24.04, preset: arm-raspi }
          - { host: macos-aarch64, runner: macos-15, preset: pc-x86_64 }
          - { host: macos-aarch64, runner: macos-15, preset: rpi-aarch64 }
          - { host: macos-aarch64, runner: macos-15, preset: arm-raspi }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install audited build prerequisites
        run: bash scripts/ci/install-build-prerequisites.sh

      - name: Setup Ninja & CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '3.28.6'
          ninjaVersion: '1.11.1'

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Rust Toolchain
        uses: ./.github/actions/setup-aros-rust

      - name: Build Rust aros-tools
        run: |
          cd tools/aros-tools
          cargo build --locked --release

      - name: Download verified unpublished toolchain candidate
        if: inputs.toolchain_source_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-${{ matrix.host }}-${{ matrix.preset }}
          path: verified
          github-token: ${{ github.token }}
          run-id: ${{ inputs.toolchain_source_run_id }}

      - name: Verify and extract unpublished toolchain candidate
        if: inputs.toolchain_source_run_id != ''
        env:
          TOOLCHAIN_HOST: ${{ matrix.host }}
          TOOLCHAIN_PROFILE: ${{ matrix.preset }}
        run: |
          set -euo pipefail
          asset="$GITHUB_WORKSPACE/verified/aros-toolchain-v1-llvm11.0.0-${TOOLCHAIN_HOST}-${TOOLCHAIN_PROFILE}.tar.xz"
          test -f "$asset"
          python3 -B scripts/toolchain/producer.py verify \
            --archive "$asset" \
            --fixtures scripts/toolchain/fixtures \
            --host "$TOOLCHAIN_HOST" \
            --target-profile "$TOOLCHAIN_PROFILE"
          install -d "$RUNNER_TEMP/aros-toolchain"
          tar -xJf "$asset" -C "$RUNNER_TEMP/aros-toolchain" --strip-components=1

      - name: Build product through aros-cli
        env:
          TOOLCHAIN_SOURCE_RUN_ID: ${{ inputs.toolchain_source_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$TOOLCHAIN_SOURCE_RUN_ID" ]]; then
            tools/aros-tools/target/release/aros build \
              --preset "${{ matrix.preset }}" \
              --clean \
              --toolchain-dir "$RUNNER_TEMP/aros-toolchain"
          else
            tools/aros-tools/target/release/aros build \
              --preset "${{ matrix.preset }}" \
              --clean
          fi
