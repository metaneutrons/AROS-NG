name: AROS-NG Multi-Platform CI Matrix

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-tooling:
    name: Rust Toolchain & Lints (100% Quality Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-aros-rust

      - name: Rustfmt Check
        run: |
          cd tools/aros-tools
          cargo fmt --all -- --check

      - name: Architecture Regression Check
        run: |
          cd tools/aros-tools
          sh scripts/check-architecture.sh

      - name: Clippy Lints (Strict Enterprise)
        run: |
          cd tools/aros-tools
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Dependency Hygiene
        run: |
          cargo install cargo-machete --version 0.9.2 --locked
          cd tools/aros-tools
          cargo machete --with-metadata

      - name: Unit Tests
        run: |
          cd tools/aros-tools
          cargo test --locked --workspace --all-features

  fetch-host-matrix:
    name: Native fetch contract [${{ matrix.host }}]
    needs: rust-tooling
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-24.04
          - host: linux-aarch64
            runner: ubuntu-24.04-arm
          - host: macos-x86_64
            runner: macos-15-intel
          - host: macos-aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-aros-rust
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '3.28.6'
          ninjaVersion: '1.11.1'
      - name: Build and test native fetch boundary
        run: |
          cd tools/aros-tools
          cargo build --locked --release --package aros-fetch
          cargo test --locked --package aros-fetch
      - name: Exercise CMake fetch integration
        run: |
          cmake -P cmake/tests/ExecutableTest.cmake
          cmake -P cmake/tests/FetchIntegrityTest.cmake
          cmake -P cmake/tests/FetchArchivePatchTest.cmake
          cmake -P cmake/tests/SourceInventoryReconfigureTest.cmake
      - name: Preserve host binary for release qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aros-fetch-${{ matrix.host }}
          path: tools/aros-tools/target/release/aros-fetch
          if-no-files-found: error
          retention-days: 7

  build-matrix:
    name: Build Preset [${{ matrix.preset }}] on ${{ matrix.os }}
    needs: rust-tooling
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [pc-x86_64, rpi-aarch64, arm-raspi]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Ninja & CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '3.28.6'
          ninjaVersion: '1.11.1'

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Rust Toolchain
        uses: ./.github/actions/setup-aros-rust

      - name: Build Rust aros-tools
        run: |
          cd tools/aros-tools
          cargo build --locked --release

      - name: CMake Configure Preset [${{ matrix.preset }}]
        run: |
          cmake --preset ${{ matrix.preset }}

      - name: CMake Build [${{ matrix.preset }}]
        run: |
          cmake --build build/${{ matrix.preset }} --parallel
